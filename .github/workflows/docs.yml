name: docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - metaorm/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync dependencies
        run: uv sync
      - name: Deploy to GitHub Pages
        run: uv run mkdocs gh-deploy --force
